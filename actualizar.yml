name: Actualizar catálogo y publicar

on:
  schedule:
    # 9 am, 12 pm, 3 pm y 6 pm hora de Monterrey (UTC-6), de lunes a sábado
    - cron: "5 15,18,21 * * 1-6"
    - cron: "5 0 * * 0,2-6"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar archivos de la página
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f README.md ] && cp README.md _site/ || true
          touch _site/.nojekyll

      - name: Descargar catálogo de Syscom
        env:
          SYSCOM_CLIENT_ID: ${{ secrets.SYSCOM_CLIENT_ID }}
          SYSCOM_CLIENT_SECRET: ${{ secrets.SYSCOM_CLIENT_SECRET }}
        run: python sync_tienda.py

      - name: Subir página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
