<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Vista previa del nuevo sitio de Total Security: servicios, nosotros, proyectos, blog, contacto y tienda para clientes.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Total Security · Seguridad electrónica en Nuevo León</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tienda de Total Security: misma identidad que totalsecurity.mx (blanco, negro y rojo de marca), encabezado claro con logo, barra de categorías negra, pie rojo */
:root{
  --fondo:#F4F4F5; --papel:#FFFFFF; --papel-2:#F7F7F8; --suave:#EDEDEF;
  --texto:#141416; --gris:#4E5058; --gris-2:#6C6F78;
  --linea:#E0E0E4; --linea-2:#EDEDEF; --borde-input:#C8C9CF;
  --barra:#FFFFFF; --barra-2:#F1F1F3; --barra-3:#E6E6EA; --barra-txt:#141416; --barra-sub:#6C6F78; --barra-acento:#C4042A;
  --negro:#111113; --negro-2:#1E1E22; --negro-txt:#FFFFFF; --negro-sub:#B9BAC2;
  --pie:#DC052D; --pie-txt:#FFFFFF;
  --btn:#141416; --btn-hover:#000000; --btn-txt:#FFFFFF;
  --naranja:#DC052D; --naranja-osc:#B00424; --naranja-txt:#C4042A; --naranja-claro:#FDECEF; --naranja-borde:#F2B6C1;
  --logo-rojo:#FF0000;
  --verde:#1F6F4A; --verde-fondo:#EAF4EE; --verde-borde:#B7D8C4;
  --ambar:#8A5A00; --azul:#1D4E89; --rojo:#9F1D14; --rojo-fondo:#FBEDEB; --rojo-borde:#E3B4AE;
  --sombra:0 1px 2px rgba(20,20,22,.06),0 6px 18px rgba(20,20,22,.06);
  --demo:#1D4E89; --demo-txt:#FFFFFF;
  --f-display:'Montserrat',system-ui,sans-serif;
  --f-texto:'Montserrat',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radio:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fondo:#0F0F11; --papel:#18181B; --papel-2:#1F1F23; --suave:#26262B;
  --texto:#EDEDEF; --gris:#A8AAB2; --gris-2:#8B8D96;
  --linea:#2E2E34; --linea-2:#25252A; --borde-input:#46474E;
  --barra:#18181B; --barra-2:#26262B; --barra-3:#33333A; --barra-txt:#EDEDEF; --barra-sub:#A8AAB2; --barra-acento:#FF5C74;
  --negro:#000000; --negro-2:#1E1E22;
  --btn:#EDEDEF; --btn-hover:#FFFFFF; --btn-txt:#141416;
  --naranja-txt:#FF6B80; --naranja-claro:#2B1217; --naranja-borde:#5E1C29;
  --verde:#5CC48F; --verde-fondo:#13261C; --verde-borde:#24543A;
  --ambar:#E0AE4A; --azul:#7FAEE6; --rojo:#F08A7E; --rojo-fondo:#2B1513; --rojo-borde:#5C2A24;
  --sombra:none; --demo:#1D3A5E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fondo:#0F0F11; --papel:#18181B; --papel-2:#1F1F23; --suave:#26262B;
  --texto:#EDEDEF; --gris:#A8AAB2; --gris-2:#8B8D96;
  --linea:#2E2E34; --linea-2:#25252A; --borde-input:#46474E;
  --barra:#18181B; --barra-2:#26262B; --barra-3:#33333A; --barra-txt:#EDEDEF; --barra-sub:#A8AAB2; --barra-acento:#FF5C74;
  --negro:#000000; --negro-2:#1E1E22;
  --btn:#EDEDEF; --btn-hover:#FFFFFF; --btn-txt:#141416;
  --naranja-txt:#FF6B80; --naranja-claro:#2B1217; --naranja-borde:#5E1C29;
  --verde:#5CC48F; --verde-fondo:#13261C; --verde-borde:#24543A;
  --ambar:#E0AE4A; --azul:#7FAEE6; --rojo:#F08A7E; --rojo-fondo:#2B1513; --rojo-borde:#5C2A24;
  --sombra:none; --demo:#1D3A5E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--fondo);color:var(--texto);font-family:var(--f-texto);font-size:15px;line-height:1.5}
a{color:var(--naranja-txt)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;letter-spacing:-.5px;margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
svg.ico{flex-shrink:0;vertical-align:middle}
.mono{font-family:var(--f-mono)}
.muted{color:var(--gris)}
.num,.mono,.precio{font-variant-numeric:tabular-nums}
.ancho{max-width:1440px;margin-inline:auto;padding-inline:32px}

/* Barra de vista previa */
.demo{background:var(--demo);color:var(--demo-txt);font-size:13px}
.demo-in{max-width:1440px;margin-inline:auto;padding:8px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.demo strong{letter-spacing:.6px;text-transform:uppercase;font-size:12px}
.demo-roles{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:3px;border-radius:7px}
.demo-roles button{border:0;background:transparent;color:#fff;font:500 13px var(--f-texto);padding:6px 12px;border-radius:5px;cursor:pointer;min-height:32px}
.demo-roles button[aria-pressed="true"]{background:#fff;color:#15171C;font-weight:600}
.demo-nota{opacity:.85;margin-left:auto}
.demo .btn-reset{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:5px;padding:5px 10px;font:500 12px var(--f-texto);cursor:pointer}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 15px var(--f-texto);text-decoration:none;cursor:pointer;background:var(--btn);color:var(--btn-txt);white-space:nowrap}
.btn:hover{background:var(--btn-hover);color:var(--btn-txt)}
.btn-naranja{background:var(--naranja);color:#fff}.btn-naranja:hover{background:var(--naranja-osc);color:#fff}
.btn-borde{background:var(--papel);color:var(--texto);border-color:var(--borde-input)}.btn-borde:hover{background:var(--suave);color:var(--texto)}
.btn-chico{min-height:36px;padding:0 14px;font-size:14px}
.btn-peligro{background:var(--papel);color:var(--rojo);border-color:var(--rojo-borde)}.btn-peligro:hover{background:var(--rojo-fondo);color:var(--rojo)}
.btn-ancho{width:100%}
label.campo{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.input,select.input,textarea.input{min-height:44px;border:1px solid var(--borde-input);border-radius:6px;padding:0 12px;font:15px var(--f-texto);color:var(--texto);background:var(--papel);width:100%}
textarea.input{padding:10px 12px;min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--naranja);flex-shrink:0;margin:2px 0 0}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.form{display:flex;flex-direction:column;gap:16px}
.form-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ayuda{font-size:13px;color:var(--gris);margin:0}
.aviso{padding:12px 16px;border-radius:var(--radio);font-weight:500;border:1px solid;display:flex;gap:12px;align-items:center}
.aviso-ok{background:var(--verde-fondo);border-color:var(--verde-borde);color:var(--verde)}
.aviso-error{background:var(--rojo-fondo);border-color:var(--rojo-borde);color:var(--rojo)}
.aviso-info{background:var(--naranja-claro);border-color:var(--naranja-borde);color:var(--naranja-txt)}
.aviso button{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:4px}
.flash-zona{max-width:1440px;margin:16px auto 0;padding-inline:32px}

/* Barra superior */
.util{background:var(--negro);color:var(--negro-sub);font-size:13px}
.util-in{max-width:1440px;margin-inline:auto;padding:6px 32px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.util a{color:var(--negro-txt);text-decoration:none;font-weight:500}
.util a:hover{color:#FF8FA0}
.util-der{margin-left:auto;display:flex;gap:18px;align-items:center}
.wa{display:inline-flex;align-items:center;gap:6px;background:#1FA855;color:#fff !important;border-radius:999px;padding:3px 12px;font-weight:600}
.barra{background:var(--barra);color:var(--barra-txt);border-bottom:1px solid var(--linea)}
.barra-in{max-width:1440px;margin-inline:auto;min-height:72px;display:flex;align-items:center;gap:32px;padding:10px 32px}
.logo{display:flex;align-items:center;gap:12px;color:var(--barra-txt);text-decoration:none;flex-shrink:0}
.logo svg.logo-svg{height:52px;width:auto;display:block}
.logo-svg .rojo{fill:var(--logo-rojo)}
.logo-svg .tinta{fill:currentColor}
.tag-tienda{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--naranja-txt);border-left:1px solid var(--linea);padding-left:12px;line-height:1.2}
.buscador{flex-grow:1;max-width:620px;height:46px;background:var(--barra-2);border-radius:999px;border:1px solid var(--linea);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--barra-sub)}
.buscador input{flex-grow:1;background:transparent;border:0;color:var(--barra-txt);font:15px var(--f-texto);outline:none;min-width:0;height:100%}
.buscador input::placeholder{color:var(--barra-sub)}
.buscador:focus-within{outline:3px solid var(--naranja)}
.barra-der{margin-left:auto;display:flex;align-items:center;gap:20px}
.enlace-claro{color:var(--barra-txt);font-weight:500;text-decoration:none}.enlace-claro:hover{color:var(--barra-acento)}
.barra-cot{display:flex;align-items:center;gap:8px;color:var(--barra-txt);text-decoration:none;font-weight:500;min-height:44px}
.barra-cot:hover{color:var(--barra-acento)}
.burbuja{background:var(--naranja);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
.usuario{position:relative}
.usuario>button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--barra-txt);cursor:pointer;min-height:44px;font:inherit;text-align:left}
.avatar{width:36px;height:36px;border-radius:18px;background:var(--barra-3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.usuario-txt{display:flex;flex-direction:column;line-height:1.2}
.usuario-txt strong{font-size:14px}.usuario-txt small{font-size:12px;color:var(--barra-acento)}
.menu-caja{position:absolute;right:0;top:calc(100% + 6px);background:var(--papel);color:var(--texto);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:220px;padding:6px;z-index:20;display:flex;flex-direction:column}
.menu-caja a{display:block;padding:10px 12px;border-radius:6px;color:var(--texto);text-decoration:none;font:500 14px var(--f-texto)}
.menu-caja a:hover{background:var(--suave)}
.cats{background:var(--negro)}
.cats-in{max-width:1440px;margin-inline:auto;display:flex;gap:4px;padding:0 24px;overflow-x:auto;scrollbar-width:thin}
.cats a{white-space:nowrap;color:var(--negro-txt);text-decoration:none;font-weight:500;font-size:14px;padding:14px 10px;border-bottom:3px solid transparent}
.cats a:hover{color:#FF8FA0}
.cats a[aria-current]{border-bottom-color:var(--naranja);color:var(--negro-txt);font-weight:700}

/* Portada */
.hero{border-bottom:1px solid var(--linea)}
.hero-in{max-width:1440px;margin-inline:auto;padding:48px 32px 40px;display:flex;align-items:flex-end;gap:48px}
.hero-txt{flex-grow:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.sobre{font-size:12px;font-weight:800;color:var(--naranja-txt);letter-spacing:1.6px;text-transform:uppercase}
.hero h1{font-size:52px;max-width:900px}
.hero p{margin:0;font-size:18px;color:var(--gris);max-width:680px}
.hero-acc{display:flex;gap:12px;flex-wrap:wrap}
.seccion{max-width:1440px;margin-inline:auto;padding:32px}
.seccion>h2{font-size:28px;margin-bottom:18px}
.grid-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cat-caja{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:22px;text-decoration:none;color:var(--texto);display:flex;flex-direction:column;gap:6px;min-height:120px}
.cat-caja:hover{border-color:var(--texto);color:var(--texto)}
.cat-caja .cat-nom{font-family:var(--f-display);font-weight:800;font-size:21px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cat-caja .cat-nom span{font-family:var(--f-texto);font-size:20px;color:var(--naranja-txt)}
.cat-caja .cat-subs{font-size:14px;color:var(--gris)}
.franja{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.franja div{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:20px;display:flex;flex-direction:column;gap:6px}
.franja strong{font-family:var(--f-display);font-size:18px;font-weight:800}
.franja span{color:var(--gris);font-size:14px}

/* Catálogo */
.catalogo{max-width:1440px;margin-inline:auto;display:flex;gap:36px;padding:28px 32px 48px;align-items:flex-start}
.filtros{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:26px;font-size:14px}
.filtros-caja{display:flex;flex-direction:column;gap:26px}
.filtros-movil{display:none}
.filtro-tit{font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);margin-bottom:8px}
.filtro-lista{display:flex;flex-direction:column;gap:2px}
.filtro-lista a{color:var(--texto);text-decoration:none;padding:7px 8px;border-radius:4px;display:flex;justify-content:space-between}
.filtro-lista a:hover{background:var(--suave)}
.filtro-lista a[aria-current]{background:var(--btn);color:var(--btn-txt)}
.filtro-lista small{color:inherit;opacity:.7}
.caja-oscura{background:var(--negro);color:var(--negro-txt);border-radius:var(--radio);padding:20px;display:flex;flex-direction:column;gap:10px}
.caja-oscura h3{font-size:20px}
.caja-oscura p{margin:0;color:var(--negro-sub);font-size:14px}
.caja-oscura a{color:var(--negro-txt);font-weight:700}
.resultados{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.res-cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.res-cab h1{font-size:32px}
.res-cab .orden{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.res-cab .orden select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-filtro{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde-input);background:var(--papel);border-radius:16px;padding:4px 10px;font-size:13px;color:var(--texto);text-decoration:none}
.grid-prod{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra)}
.tarjeta:hover{border-color:var(--gris-2)}
.foto{background:var(--papel-2);display:flex;align-items:center;justify-content:center;color:var(--gris-2)}
.tarjeta .foto{height:190px;border-bottom:1px solid var(--linea-2)}
.tarjeta-cuerpo{padding:16px;display:flex;flex-direction:column;gap:6px;flex-grow:1}
.marca{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--gris)}
.tarjeta-titulo{font-family:var(--f-texto);font-size:15px;font-weight:600;line-height:1.35;margin:0}
.tarjeta-titulo a{color:var(--texto);text-decoration:none}
.tarjeta-titulo a:hover{color:var(--naranja-txt);text-decoration:underline}
.modelo{font-family:var(--f-mono);font-size:13px;color:var(--gris)}
.stock{font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.stock-ok{color:var(--verde)}.stock-poco{color:var(--ambar)}.stock-no{color:var(--gris)}
.tarjeta-precio{margin-top:auto;padding-top:12px;border-top:1px solid var(--linea-2);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--naranja-txt);flex-wrap:wrap}
.precio{font-family:var(--f-display);font-size:23px;color:var(--texto);font-weight:800;letter-spacing:-.5px}
.mas-iva{font-size:13px;color:var(--gris);font-weight:400}
.vacio{background:var(--papel);border:1px dashed var(--borde-input);border-radius:var(--radio);padding:48px 24px;text-align:center;color:var(--gris)}

/* Producto */
.migas{max-width:1440px;margin-inline:auto;padding:20px 32px 0;font-size:14px;color:var(--gris)}
.migas a{color:var(--gris)}
.ficha{max-width:1440px;margin-inline:auto;padding:20px 32px 48px;display:flex;flex-direction:column;gap:24px}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:28px}
.ficha-top{display:flex;gap:36px}
.galeria{width:440px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.galeria .foto{height:380px;border:1px solid var(--linea-2);border-radius:6px}
.miniaturas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.miniaturas div{height:72px;border:1px solid var(--linea);border-radius:6px;background:var(--papel-2)}
.miniaturas div:first-child{border:2px solid var(--naranja)}
.ficha-info{flex-grow:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.ficha-info h1{font-size:34px}
.caja-precio{background:var(--fondo);border-radius:var(--radio);padding:20px;display:flex;flex-direction:column;gap:4px}
.caja-precio .tit{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--naranja-txt)}
.caja-precio .precio{font-size:42px}
.niveles-tabla{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.niveles-tabla td{padding:6px 0;border-top:1px solid var(--linea)}
.niveles-tabla td:last-child{text-align:right;font-family:var(--f-mono)}
.agregar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cantidad{display:flex;align-items:center;border:1px solid var(--borde-input);border-radius:6px;height:48px;background:var(--papel)}
.cantidad button{width:44px;height:46px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--texto)}
.cantidad input{width:56px;border:0;text-align:center;font:16px var(--f-mono);height:46px;padding:0;background:transparent;color:var(--texto);-moz-appearance:textfield}
.cantidad input::-webkit-inner-spin-button{-webkit-appearance:none}
.agregar .btn{flex-grow:1;min-height:48px;font-size:16px}
ul.specs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
.specs li{padding:10px 0;border-bottom:1px solid var(--linea-2);display:flex;justify-content:space-between;gap:16px}
.specs li span:first-child{color:var(--gris)}

/* Tablas y cotización */
.cot-marco{max-width:1440px;margin-inline:auto;padding:28px 32px 48px;display:flex;gap:28px;align-items:flex-start}
.cot-lista{flex-grow:1;min-width:0}
.cot-lado{width:380px;flex-shrink:0}
.tabla-marco{border:1px solid var(--linea);border-radius:var(--radio);overflow-x:auto;background:var(--papel);position:relative}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);background:var(--papel-2);padding:12px 16px;border-bottom:1px solid var(--linea);white-space:nowrap}
.tabla td{padding:12px 16px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
.tabla tr:last-child td{border-bottom:0}
.tabla .num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.item-prod{display:flex;gap:12px;align-items:center;min-width:240px}
.item-prod .foto{width:56px;height:56px;border:1px solid var(--linea-2);border-radius:4px;flex-shrink:0}
.cant-chica{width:80px !important;text-align:center;font-family:var(--f-mono)}
.totales{display:flex;flex-direction:column;gap:8px;font-size:15px}
.totales div{display:flex;justify-content:space-between;gap:12px}
.totales .gran{padding-top:10px;border-top:1px solid var(--texto);font-weight:600;font-size:18px}
.pila{display:flex;flex-direction:column;gap:16px}
.fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.estado{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;white-space:nowrap}
.estado .punto{width:8px;height:8px;border-radius:4px;background:currentColor}
.estado-activo,.estado-atendida{color:var(--verde)}
.estado-invitado{color:var(--azul)}
.estado-pendiente,.estado-enviada{color:var(--naranja-txt)}
.estado-inactivo,.estado-cancelada{color:var(--gris)}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;background:var(--suave);font-size:13px;font-weight:500;white-space:nowrap}

/* Cuenta */
.cuenta{max-width:1100px;margin-inline:auto;padding:48px 32px;display:flex;gap:48px;align-items:flex-start}
.cuenta-caja{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:32px;width:460px;flex-shrink:0}
.cuenta-caja h1{font-size:30px;margin-bottom:6px}
.cuenta-lado{flex-grow:1;display:flex;flex-direction:column;gap:16px;padding-top:12px;min-width:0}
.cuenta-lado h2{font-size:32px}
.cuenta-lado ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;color:var(--gris)}
.cuenta-sola{max-width:500px;margin:48px auto;padding-inline:16px}
.cuenta-sola .cuenta-caja{width:100%}

/* Hoja de cotización */
.hoja{max-width:900px;margin:24px auto;background:#FFFFFF;color:#15171C;padding:48px;border:1px solid var(--linea)}
.hoja .muted{color:#4D515A}
.hoja-cab{display:flex;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:2px solid #15171C;margin-bottom:24px;flex-wrap:wrap}
.hoja .logo{color:#141416}.hoja .logo-svg{height:70px;width:auto}.hoja .logo-svg .rojo{fill:#FF0000}
.hoja-datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px;font-size:14px}
.hoja .tabla th{background:#F3F2EE;color:#4D515A;border-color:#DAD8D1}
.hoja .tabla td{border-color:#ECEAE4}
.hoja .totales .gran{border-color:#15171C}
.hoja .filtro-tit{color:#4D515A}

/* Pie */
.pie{background:var(--pie);color:var(--pie-txt);margin-top:24px}
.pie-in{max-width:1440px;margin-inline:auto;padding:40px 32px 28px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:32px;font-size:14px}
.pie h4{margin:0 0 10px;font-size:16px;font-weight:800}
.pie a{color:var(--pie-txt)}
.pie ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pie .logo-svg{height:64px;width:auto;align-self:flex-start}
.pie .logo-svg .rojo,.pie .logo-svg .tinta{fill:#FFFFFF}
.pie-base{max-width:1440px;margin-inline:auto;padding:14px 32px 22px;border-top:1px solid rgba(255,255,255,.35);display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.pie-nota{margin-left:auto}
.redes{display:flex;gap:10px;margin-top:12px}
.redes a{width:36px;height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-decoration:none}

/* Admin */
.admin-marco{display:flex;min-height:calc(100vh - 48px)}
.admin-nav{width:240px;flex-shrink:0;background:var(--negro);color:var(--negro-sub);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.admin-logo{padding:0 8px 20px}.admin-logo .logo{color:#FFFFFF}.admin-logo .tag-tienda{color:#FF8FA0;border-color:#33333A}
.admin-nav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:8px;color:var(--negro-sub);text-decoration:none}
.admin-nav a:hover{background:var(--negro-2);color:var(--negro-txt)}
.admin-nav a[aria-current]{background:var(--negro-2);color:var(--negro-txt);font-weight:700;box-shadow:inset 3px 0 0 var(--naranja)}
.admin-tienda{margin-top:auto}
.admin-main{flex-grow:1;min-width:0;padding:32px 40px 60px;display:flex;flex-direction:column;gap:22px}
.admin-main>*{min-width:0;max-width:100%}
.admin-main h1{font-size:38px}
.admin-cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.banda{background:var(--naranja-claro);border:1px solid var(--naranja-borde);border-radius:var(--radio);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.caja-dato{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:4px}
.dos-col{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.dos-col>*{min-width:0}
.enlace-copiar{display:flex;gap:8px}
.enlace-copiar input{font-family:var(--f-mono);font-size:13px}
.filtros-admin{display:flex;gap:12px;flex-wrap:wrap}
.filtros-admin .input[type=search]{flex:1 1 220px;width:auto}
.filtros-admin select{width:auto}
.link-btn{background:none;border:0;padding:0;color:var(--naranja-txt);font:600 14px var(--f-texto);cursor:pointer;text-decoration:underline}

@media (max-width:1200px){
  .grid-prod{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dos-col{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .ancho,.barra-in,.hero-in,.catalogo,.migas,.ficha,.cot-marco,.seccion,.pie-in,.demo-in,.flash-zona{padding-inline:16px}
  .barra-in{flex-wrap:wrap;gap:12px}
  .buscador{order:3;max-width:none;flex-basis:100%}
  .usuario-txt,.barra-cot .txt{display:none}
  .logo svg.logo-svg{height:42px}
  .util-in{padding-inline:16px}
  .util .sitio{display:none}
  .util-der{margin-left:0}
  .pie-in{grid-template-columns:minmax(0,1fr);padding-inline:16px}
  .pie-base{padding-inline:16px}
  .demo-nota{margin-left:0;flex-basis:100%}
  .hero-in{flex-direction:column;align-items:flex-start;padding-top:32px}
  .hero h1{font-size:34px}
  .grid-cats,.franja{grid-template-columns:minmax(0,1fr)}
  .catalogo{flex-direction:column}
  .filtros{width:100%}
  .filtros .caja-oscura{display:none}
  .filtros-movil{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--borde-input);border-radius:6px;background:var(--papel);font:600 15px var(--f-texto);color:var(--texto);cursor:pointer}
  .filtros-caja.cerrado{display:none}
  .filtros-caja{margin-top:16px}
  .res-cab .orden{margin-left:0}
  .grid-prod{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tarjeta .foto{height:140px}
  .ficha-top{flex-direction:column}
  .galeria{width:100%}
  .galeria .foto{height:260px}
  .ficha-info h1{font-size:30px}
  ul.specs{grid-template-columns:minmax(0,1fr)}
  .cot-marco{flex-direction:column}
  .cot-lado{width:100%}
  .cuenta{flex-direction:column;padding:24px 16px}
  .cuenta-caja{width:100%;padding:24px}
  .form-2,.hoja-datos{grid-template-columns:minmax(0,1fr)}
  .admin-marco{flex-direction:column}
  .admin-nav{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px}
  .admin-logo{width:100%;padding:4px 8px 8px}
  .admin-tienda{margin-top:0}
  .admin-main{padding:20px 16px}
  .admin-main h1{font-size:36px}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{padding:18px}
  .hoja{padding:20px;margin:16px}
  .pie-nota{margin-left:0}
}
@media (max-width:600px){.demo-nota{display:none}}
@media (max-width:480px){
  .grid-prod{grid-template-columns:minmax(0,1fr)}
  .barra-der{gap:12px}
  .barra-der .btn{padding:0 12px;font-size:14px}
}

/* Sitio completo: encabezado, navegación y páginas de la empresa */
.util .usuario>button{color:var(--negro-txt);min-height:36px}
.util .avatar{width:28px;height:28px;font-size:12px;background:#33333A;color:#fff}
.util .usuario-txt strong{font-size:13px}.util .usuario-txt small{font-size:11px;color:#FF8FA0}
.util-dato{color:var(--negro-sub)}
.util-der{gap:14px}
.util-cot{display:inline-flex;align-items:center;gap:6px}
.cabecera{background:var(--barra);color:var(--barra-txt);border-bottom:1px solid var(--linea);position:relative;z-index:5}
.cabecera-in{max-width:1440px;margin-inline:auto;padding:12px 32px;display:flex;align-items:center;gap:28px}
.cabecera .logo{color:var(--barra-txt)}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{color:var(--texto);text-decoration:none;font-weight:600;font-size:15px;padding:10px 12px;border-radius:999px}
.nav a:hover{background:var(--suave)}
.nav a[aria-current]{color:var(--naranja-txt)}
.nav a.nav-tienda{display:inline-flex;align-items:center;gap:6px}
.nav a.nav-tienda::after{content:"Nuevo";font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--naranja);color:#fff;border-radius:999px;padding:2px 7px}
.nav a.nav-cta{color:#fff;margin-left:10px;padding:0 20px}
.nav a.nav-cta:hover{background:var(--naranja-osc)}
.hamb{display:none;margin-left:auto;background:none;border:1px solid var(--linea);border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center;color:var(--texto);cursor:pointer}
.barra-tienda{background:var(--negro)}
.barra-tienda-in{max-width:1440px;margin-inline:auto;padding:8px 24px;display:flex;align-items:center;gap:16px}
.barra-tienda .cats-in{padding:0;flex:1 1 auto;min-width:0;margin:0}
.barra-tienda .cats-in a{white-space:nowrap;color:var(--negro-txt);text-decoration:none;font-weight:600;font-size:14px;padding:10px 10px;border-bottom:3px solid transparent}
.barra-tienda .cats-in a:hover{color:#FF8FA0}
.barra-tienda .cats-in a[aria-current]{border-bottom-color:var(--naranja)}
.barra-tienda .buscador{flex:0 1 380px;background:#1E1E22;border-color:#33333A;color:#B9BAC2;height:42px}
.barra-tienda .buscador input{color:#FFFFFF}
.barra-tienda .buscador input::placeholder{color:#8B8D96}
.btn-blanco{background:#FFFFFF;color:#141416}.btn-blanco:hover{background:#F1F1F3;color:#141416}
.btn-contorno{background:transparent;color:inherit;border-color:currentColor}.btn-contorno:hover{background:rgba(127,127,127,.12);color:inherit}
.wa-btn{background:#1FA855;color:#fff}.wa-btn:hover{background:#178A45;color:#fff}
.rojo-txt{color:var(--naranja)}
svg.arcos{position:absolute;pointer-events:none;fill:currentColor}

/* Portada de la empresa */
.hero-corp{background:var(--negro);color:#FFFFFF;overflow:hidden}
.hero-corp-in{max-width:1440px;margin-inline:auto;padding:72px 32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:center;position:relative}
.hero-corp .arcos{width:620px;height:620px;right:-120px;top:-140px;color:var(--naranja);opacity:.22}
.hero-corp-txt{display:flex;flex-direction:column;gap:18px;position:relative}
.hero-corp .sobre{color:#FF8FA0}
.hero-corp h1{font-size:64px;line-height:1.02;letter-spacing:-1.5px}
.hero-corp .rojo-txt{color:#FF3B57}
.hero-corp p{margin:0;font-size:18px;color:#C9CAD1;max-width:600px}
.hero-corp .hero-acc .btn-contorno{color:#FFFFFF}
.hero-panel{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px;display:flex;flex-direction:column}
.hp-fila{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.hp-fila:last-child{border-bottom:0}
.hp-fila span:last-child{color:#B9BAC2;font-size:13px}
.hp-ico{color:#FF3B57;display:flex}
.hp-punto{width:12px;height:12px;border-radius:6px;background:#2BD576;box-shadow:0 0 0 6px rgba(43,213,118,.18);justify-self:center}
@media (prefers-reduced-motion:no-preference){.hp-punto{animation:latido 2s ease-in-out infinite}}
@keyframes latido{50%{box-shadow:0 0 0 10px rgba(43,213,118,.05)}}
.sec-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-cab h2{font-size:32px}
.sec-cab a{font-weight:700;text-decoration:none}
.grid-serv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.serv{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:24px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--texto);box-shadow:var(--sombra)}
.serv:hover{border-color:var(--naranja)}
.serv strong{font-size:18px;font-weight:800}
.serv .muted{font-size:14px}
.serv-ico{width:56px;height:56px;border-radius:14px;background:var(--naranja-claro);color:var(--naranja-txt);display:flex;align-items:center;justify-content:center}
.serv-ico.grande{width:84px;height:84px;border-radius:20px;flex-shrink:0}
.serv-mas{margin-top:auto;font-weight:700;font-size:14px;color:var(--naranja-txt)}
.banda-tienda{position:relative;overflow:hidden;background:var(--negro);color:#FFFFFF;border-radius:20px;padding:40px;display:flex;gap:32px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banda-tienda .arcos{width:420px;height:420px;left:-60px;bottom:-200px;color:var(--naranja);opacity:.25}
.banda-tienda>div{position:relative;max-width:720px}
.banda-tienda h2{font-size:34px;margin:6px 0 10px}
.banda-tienda p{margin:0;color:#C9CAD1}
.banda-tienda .btn-contorno{color:#FFFFFF}
.clientes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.clientes span{background:#FFFFFF;border:1px solid var(--linea);border-radius:var(--radio);min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;font-size:17px;color:var(--gris);letter-spacing:.3px}
.clientes img{max-height:72px;max-width:80%;width:auto;height:auto;object-fit:contain;filter:grayscale(1);opacity:.85}
.clientes span:hover img{opacity:1}
.grid-blog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.post{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;text-decoration:none;color:var(--texto);display:flex;flex-direction:column;box-shadow:var(--sombra)}
.post:hover{border-color:var(--naranja)}
.post-img{position:relative;height:150px;background:var(--negro);overflow:hidden;display:block}
.post-img .arcos{width:300px;height:300px;right:-70px;top:-70px;color:var(--naranja);opacity:.5}
.chip-rojo{position:absolute;left:16px;bottom:14px;background:var(--naranja);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.post strong{padding:16px 18px 6px;font-size:17px;line-height:1.3}
.post .serv-mas{padding:0 18px 18px}

/* Páginas internas */
.titulo-pag{background:var(--negro);color:#FFFFFF;overflow:hidden}
.titulo-pag .ancho{position:relative;padding-block:56px;display:flex;flex-direction:column;gap:12px}
.titulo-pag .arcos{width:480px;height:480px;right:-60px;top:-150px;color:var(--naranja);opacity:.25}
.titulo-pag .sobre{color:#FF8FA0;position:relative}
.titulo-pag h1{font-size:48px;max-width:820px;position:relative}
.titulo-pag p{margin:0;font-size:17px;color:#C9CAD1;max-width:720px;position:relative}
.serv-largo{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:28px;display:flex;gap:28px;align-items:flex-start;box-shadow:var(--sombra);scroll-margin-top:16px}
.serv-largo.destacado{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-claro)}
.serv-largo h2{font-size:26px}
.num-serv{font-size:12px;color:var(--naranja-txt);font-weight:500}
.mv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.mv-caja{position:relative;overflow:hidden;border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:14px;color:#FFFFFF}
.mv-caja>*{position:relative}
.mv-caja h2{font-size:30px}
.mv-caja p{margin:0;font-size:16px;line-height:1.6}
.mv-caja .arcos{position:absolute;width:360px;height:360px;right:-80px;bottom:-140px;opacity:.18;color:#FFFFFF}
.mv-negra{background:var(--negro)}.mv-negra p{color:#D5D6DC}
.mv-roja{background:#C8102E}
.pasos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.paso{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:22px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--naranja)}
.paso .mono{color:var(--naranja-txt);font-size:13px}
.paso strong{font-size:18px}
.grid-proy{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.proy{display:flex;flex-direction:column;gap:6px}
.proy-foto{position:relative;overflow:hidden;height:170px;border-radius:var(--radio);background:var(--suave);display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:13px;margin-bottom:6px}
.proy-foto .arcos{width:240px;height:240px;right:-60px;top:-60px;color:var(--naranja);opacity:.15}
.banda-suscribe{background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.contacto{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.cta-pie{background:var(--negro);color:#FFFFFF;margin-top:40px}
.cta-pie-in{max-width:1440px;margin-inline:auto;padding:40px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta-pie h2{font-size:30px}
.cta-pie p{margin:6px 0 0;color:#C9CAD1}
.cta-pie .btn-contorno{color:#FFFFFF}
.cta-pie+.pie{margin-top:0}

@media (max-width:1200px){
  .nav a{padding:10px 9px;font-size:14px}
  .hero-corp h1{font-size:52px}
  .pasos,.grid-proy{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1060px){
  .hamb{display:inline-flex}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--barra);border-bottom:1px solid var(--linea);flex-direction:column;align-items:stretch;padding:8px 16px 16px;gap:2px;box-shadow:0 12px 24px rgba(0,0,0,.12)}
  .nav.abierto{display:flex}
  .nav a{padding:12px;font-size:16px;border-radius:10px}
  .nav a.nav-cta{margin:8px 0 0;justify-content:center;min-height:48px}
}
@media (max-width:900px){
  .cabecera-in{padding:10px 16px}
  .barra-tienda-in{flex-direction:column;align-items:stretch;padding:8px 16px;gap:6px}
  .barra-tienda .cats-in{overflow-x:auto}
  .barra-tienda .buscador{flex-basis:auto;order:-1}
  .hero-corp-in{grid-template-columns:minmax(0,1fr);padding:48px 16px}
  .hero-corp h1{font-size:40px}
  .titulo-pag h1{font-size:34px}
  .grid-serv,.grid-blog,.mv,.contacto{grid-template-columns:minmax(0,1fr)}
  .clientes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .serv-largo{flex-direction:column;padding:20px}
  .mv-caja,.banda-tienda{padding:26px}
  .cta-pie-in{padding:32px 16px}
  .util-in{gap:12px}
  .util .usuario-txt{display:none}
}
@media (max-width:520px){
  .pasos,.grid-proy{grid-template-columns:minmax(0,1fr)}
  .util .util-dato{display:none}
}

.post-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post-img{height:180px}
.post-meta{font-size:13px;color:var(--gris);padding:14px 18px 0}
.post strong{padding-top:6px}
.post-dest{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);background:var(--papel);border:1px solid var(--linea);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--texto);box-shadow:var(--sombra)}
.post-dest:hover{border-color:var(--naranja)}
.dest-img{position:relative;min-height:300px;display:block}
.dest-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dest-txt{padding:32px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.dest-txt strong{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.dest-txt .post-meta{padding:0}
.suscribe-campos{flex:1 1 360px;max-width:520px}
.suscribe-campos .input{flex:1 1 220px;width:auto}
.articulo{max-width:820px;margin-inline:auto;padding:40px 32px 8px;display:flex;flex-direction:column;gap:24px}
.art-cab{display:flex;flex-direction:column;gap:12px}
.art-cab h1{font-size:44px;line-height:1.08}
.art-cab .post-meta{padding:0}
.art-img{border-radius:16px;overflow:hidden;aspect-ratio:960/504;max-width:100%}
.art-img img{width:100%;height:100%;object-fit:cover;display:block}
.art-cuerpo{font-size:17px;line-height:1.75;color:var(--texto)}
.art-cuerpo p{margin:0 0 18px}
.art-cuerpo h3{font-size:21px;margin:30px 0 10px}
.art-cuerpo strong{font-weight:700}
.art-cta{background:var(--naranja-claro);border:1px solid var(--naranja-borde);border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.art-cta>div:first-child{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){
  .post-dest{grid-template-columns:minmax(0,1fr)}
  .dest-img{min-height:200px}
  .dest-txt{padding:22px}
  .dest-txt strong{font-size:22px}
  .articulo{padding:28px 16px 0}
  .art-cab h1{font-size:30px}
  .art-cuerpo{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){.tarjeta,.cat-caja,.serv,.post{transition:border-color .15s}}

información sobre tu hogar de manera eficiente.</p>\n<p>Aquí te mostramos cómo transformar tu hogar en una casa inteligente:</p>\n<h3>1. Conexión a Internet</h3>\n<p>El servicio de internet es esencial para conectar y gestionar los dispositivos inteligentes en tu hogar. Asegúrate de contar con un servicio de alta velocidad, al menos 5 Mbps, para un funcionamiento óptimo. Algunas tecnologías Bluetooth funcionan dentro del rango de alcance, pero si deseas controlar tus dispositivos desde fuera de casa, necesitarás una conexión a internet.</p>\n<h3>2. Revisión de la Instalación Eléctrica</h3>\n<p>Dado que los dispositivos inteligentes requieren energía, es importante revisar y, si es necesario, actualizar la instalación eléctrica para evitar problemas como sobrecargas. Un electricista experto puede encargarse de esta revisión y realizar las mejoras necesarias.</p>\n<h3>3. Elección del Sistema de Automatización</h3>\n<p>Selecciona un sistema central para controlar tu casa inteligente. Muchos dispositivos inteligentes funcionan con aplicaciones propias y son compatibles con asistentes de voz como Amazon Echo, Alexa, Google Home y Apple HomePod. Asegúrate de que tus dispositivos sean compatibles con el sistema que elijas.</p>\n<h3>4. Construcción de tu Hogar Inteligente</h3>\n<p>Una vez que hayas elegido tu sistema de control, puedes comenzar a construir tu hogar inteligente. Empieza por elegir una categoría de dispositivos, como iluminación, seguridad, electrodomésticos, entretenimiento, y busca productos compatibles con tu sistema. Avanza gradualmente, integrando dispositivos inteligentes en tu hogar.</p>\n<h3>5. Disfruta de tu Hogar Inteligente</h3>\n<p>Una vez que todo esté en su lugar, disfruta de los beneficios de tu casa inteligente. Controla tus dispositivos y automatiza tareas para hacer tu vida más cómoda y eficiente.</p>\n<p>Recuerda tener en cuenta el idioma, la facilidad de instalación, el precio, la capacidad de múltiples usuarios y la garantía al elegir tus dispositivos inteligentes. Comienza tu viaje hacia una casa inteligente hoy mismo y experimenta la comodidad y la eficiencia que ofrece la automatización del hogar.</p>"}, {"id": "29", "t": "¿Qué es la tecnología ColorVu?", "tag": "CCTV", "fecha": "26 de septiembre de 2023", "min": 1, "img": "data:image/webp;base64,UklGRkaGAABXRUJQVlA4WAoAAAAgAAAAvwMA9wEASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggWIQAAFB1Ap0BKsAD+AE+lUaeS6Wjpqyksur5kBKJZW7E/Ezg1pfk6GlsgcGaUVFwosjgi//A/zO3bj349/E/Nb3COQfFX6X5S+MfJs52/rec903/vP8V+OPyz/7X/i9s36k/7f5//Qh/Tv6V/p/15+Ef/k9jX9u/7vqR/pv+j/7H9592D/pf87/R+/H+5f6L/t+4L/N/8P6YPs//uX7FH7R///13/2w+GL+t/8b9nPgR/Z3/2+wB///UA///Ff/770RfKf6T/jeH/oB+37aeE/47/W82PvjnK/v/CH5X6i/uXzovzu9D27/meg77wfkPP3/R/8/p7/IeoL5yf+byL/afYQ/qf+09YXwjfsH/Q9h/pr+k6SRBh0yWnMiM3BoRPFGwkNaLUPWZtFzjnA9/4KkPVbid61NaEmU78Rec5EGJw9PGgNithcyX3KJ/Ajh24LL50CHIeNPbnlGNNQUd+MFkfxZYMLlG5Ccni7P51SJ/YLxzOkoUXTtReaa9rXQ3sdo6qOV8nHZ0JjqbWcje2/8WXWbzLAL5T9mSs+Wv0b/SjO/aif5MNSm54VefqwrYCUi/lrj3z2C57ee8PX2fnF1ctg9NzmejJ5f7OjXgU0Cla2o+XR6DUsq5GQMgaeMjkDaUXhOcqnDmvJdhOcnMRAhqGpvIJFHy6NjZon8JGayr13U1tQB0+Dr9JSNzV3nq32iPSVeoJsXTmXvp85wPknv5whBjsZqL6o05UElnrgrt7W/+i1gFop6aqbI4ehGvZjZAAePB+/+ocvMaAz1AksP7wAMs0owq3VIGN9OkDXRn5wh89PSz6U79uH/JPSQ1A2yTcOf019mRTTVoN56VwASQztfylZt7j4UacS+pKflkofPDtECqNr49W78W20z/c/dcdb/myy8K6JTUBXcrxre+dwkHZUZ4+TpJS51/WljuBoCPYsp5JeECA8Dbs87fo+xOdPIHNUgmZt9JkKSwTiEvQ54yyWX9ClqRLdq3BB/QbqIlDXJr1ZEwRU xG7+61v8CRTQ5IxNhAm8KLW4E4RiwD1UAAAlk+KN6IhVZrMrJ9GqIj2GrvbK/uhTs3qxTAJ80T29AxNCPLUZXYNHewOhgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", "html": "<p>Cuando hablamos de seguridad y protección, la visión detallada es esencial, incluso en condiciones de poca luz.</p>\n<p>La tecnología líder de la industria, <strong>ColorVu</strong> de Hikvision, captura videos de alta calidad y a todo color las 24 horas del día, los 7 días de la semana. Esto brinda la misma nitidez que la luz del día, lo que permite proteger personas y propiedades durante la noche.</p>\n<p><strong>ColorVu</strong> potencia una variedad de productos y soluciones para satisfacer diversas necesidades de seguridad. Las cámaras panorámicas de Hikvision con <strong>ColorVu</strong> ofrecen un campo de visión horizontal de 180 grados, brindando panoramas brillantes con detalles vívidos. Esto mejora el conocimiento de la situación y reduce la cantidad de cámaras necesarias.</p>\n<p>Las cámaras varifocales de Hikvision con <strong>ColorVu</strong> se adaptan a diferentes escenarios al ajustar la distancia focal. Su apertura F1.0 fija garantiza un brillo óptimo, independientemente de la distancia.</p>\n<p>Estas cámaras generan imágenes vibrantes en condiciones de poca luz, incluso con 0.0005 lux, equivalente a una noche sin luna y estrellas. Esto se logra gracias a una súper apertura F1.0 que maximiza la captura de luz y a un sensor grande de 1/1.2″.</p>\n<p>Cuando se combina <strong>ColorVu</strong> con <strong>AcuSense</strong>, las cámaras pueden capturar humanos y vehículos con colores vivos. Además, la detección de movimiento 2.0 con tecnología AcuSense distingue entre humanos, vehículos y otros objetos, mejorando la eficiencia en la reproducción de video y la búsqueda de imágenes.</p>\n<p>Los modelos con <strong>Live Guard</strong> disuaden a los intrusos con advertencias visuales y auditivas mientras notifican a los usuarios de forma remota. </p>\n<p><strong>¿Estás listo para experimentar una visión nocturna más brillante y detallada?</strong></p>"}, {"id": "22", "t": "De líneas telefónicas a los sistemas de comunicación 5G", "tag": "Monitoreo", "fecha": "26 de septiembre de 2023", "min": 2, "img": "data:image/webp;base64,UklGRkq8AABXRUJQVlA4WAoAAAAgAAAAvwMA9wEASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggXLoAALAeA50BKsAD+AE+lUSbSiWjpiaodiug0BKJZW773iwI4m7/8cmzAVoDhBoJ/hd6h7Xxn5l+z5Yv8d/b/1T/dveN3W9h+SfzJ/uv8P+RvzI/y//j/1Huf/Qf/Q/PX6A/1R/1X9//xf7MfGB+0fuw/t3/H/7PsE/pH94/7X+l/f/5X/87/6P8d7rP7f/wP+5+1XyCf0v+3f+P2xP+77G37l///3Hv2v///s7f9j9tvhW/rv/A/b74Ef2L//fsAf//2xv4B//+K2/1voo+WfyH/B/yHjf5ivkn8N/of/J/l/mC/Octfa7qX/Q/zh/f/yvpf/5P9L49/Jr6Z9gv80/qX/E/w3rMfnd4vuP/F/b32FPcL7/+0Hqufk+dn7f/u/YD81P/b4kvrvsFfsX1d/+DzA/sX/N9hfpz+kgaAR/z0e7boT8Mc8kp4OSheColjmpzJ6srw5raWRW/XtWLKLpRgFGjadEjAYLK6hBhBIicXJmHhkxF0LhZaox4Boj+niZ/UU9xP96dbpPknwac2d2V7bBwm6wu5VndcVitp4jfiNAl9RlEpe07qKaH0FQt8K5mJ3E2YNH7Ae2/dHdzrK9UnrMPFLuxi1mtcvgCbXtcKMbU317/6Dq8LjFc3iOV0ZMdLDUawpElB+VT/+3R4ttWdB+aftyLef9+C8plZ8f+sj4lR8gJwkyETxTNS+zATe4T+Cy0IPPe9z+x/qSv0qDRzLhw1Oj1qoXgWJi/QdULo0zN0zk1CGMH+5VC7K98QRstET/kOrN0jmfWL7YHn9UM7nIGkq5wnlUed5jgUiNfnmDhaIgdMaVS40LB4OsUgxT7Vty7xzyz1wyQe9RU1ZJZNnnQGyxAPmjfBPVD//VpwlNPdb+lVcNHimJO4pgABvNT+pX+I1OMKSgm3nIM9nQfSO+EI7MD0ziwKP0l50YJPOi6nDXn0Q2y5g67WJuXJUSS4CFs2o/EbXOJO4ldhFGeUMgPM4Z1lO5+lFzYjtHT7wwjvgidU9ayJHd0UYjcDP6i0GRG+LmWvCupalOuZPWcbISF1hvSAyXr1ULoTtxa9/STeymcVuMWkDydW3 rvicio, reducir costos y brindar interactividad tiene sentido.</p>\n<p>La integración de dispositivos de diferentes marcas en una única aplicación móvil o servicio web es posible gracias a plataformas en la nube cada vez más flexibles y asequibles.</p>\n<p>El cambio debe ser gradual, migrando primero a sistemas de transmisión<strong> IP, GPRS y 5G</strong>, lo que eleva el servicio y refresca la relación con los clientes. La comunicación constante con los clientes, proporcionando información crítica de seguridad, consejos y promociones, es esencial. Las aplicaciones móviles personalizadas desempeñan un papel clave.</p>\n<p>Cambiar ahora prepara un futuro positivo. Si no, el mercado forzará cambios abruptos. Los servicios de monitoreo tienen un gran potencial de crecimiento en un mercado en constante evolución. <strong>¿Estás listo para dar el siguiente paso en seguridad?</strong></p>"}];

function htmlATexto(h) {
  return h.replace(/<h3>([\s\S]*?)<\/h3>/g, '## $1\n\n').replace(/<p>([\s\S]*?)<\/p>/g, '$1\n\n').replace(/<\/?strong>/g, '**')
    .replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\n{3,}/g, '\n\n').trim();
}
function textoAHtml(t) {
  return t.split(/\n\s*\n/).map(function (b) {
    b = b.trim(); if (!b) return '';
    var h = /^##\s+/.test(b), x = e(b.replace(/^##\s+/, '')).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    return h ? '<h3>' + x + '</h3>' : '<p>' + x + '</p>';
  }).join('');
}

function render() {

app.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-ir],[data-rol],[data-accion],[data-paso],[data-quitar]');
  if (!t) { if (S.menu) { S.menu = false; render(); } return; }
  if (t.matches('input[type=checkbox],select')) return;
  if (t.dataset.ir) {
    ev.preventDefault();
    var p = {}; Object.keys(t.dataset).forEach(function (k) { if (k !== 'ir') p[k] = t.dataset[k]; });
    ir(t.dataset.ir, p); return;
  }
  if (t.dataset.rol) {
    S.rol = t.dataset.rol;
    if (S.rol === 'admin' && S.vista.indexOf('a-') !== 0) ir('a-usuarios');
    else if (S.rol !== 'admin' && (S.vista.indexOf('a-') === 0 || S.vista === 'activar')) ir('inicio');
    else render();
    return;
  }
  if (t.dataset.paso) { var inp = document.getElementById('cant'); inp.value = Math.max(1, Math.min(9999, (+inp.value || 1) + (+t.dataset.paso))); return; }
  if (t.dataset.quitar) { S.cot.items = S.cot.items.filter(function (i) { return i.id !== t.dataset.quitar; }); flash('Producto quitado de tu cotización.'); render(); return; }
  ev.preventDefault();
  var u = usuario(+S.p.uid);
  switch (t.dataset.accion) {
    case 'reiniciar': S = inicial(); render(); window.scrollTo(0, 0); break;
    case 'menu': S.menu = !S.menu; render(); break;
    case 'nav': S.navAbierto = !S.navAbierto; render(); break;
    case 'salir': S.rol = 'visitante'; flash('Cerraste sesión.', 'info'); ir('inicio'); break;
    case 'cerrar-aviso': t.closest('.aviso').remove(); break;
    case 'filtros': S.filtrosAbiertos = !S.filtrosAbiertos; render(); break;
    case 'enviar-cot':
      var items = lineasCot();
      S.cotizaciones.push({ folio: S.siguienteFolio, uid: yo().id, proyecto: S.cot.proyecto, notas: S.cot.notas, estado: 'enviada', fecha: Date.now(), items: items });
      flash('Enviamos tu cotización ' + folio(S.siguienteFolio) + '. Un asesor te contactará para confirmar existencias y entrega.');
      S.siguienteFolio++; S.cot = { proyecto: '', notas: '', items: [] }; ir('mis'); break;
    case 'copiar':
      var c = document.getElementById('enl'); c.select();
      try { navigator.clipboard.writeText(c.value).catch(function () {}); } catch (x) {}
      t.textContent = 'Copiado'; break;
    case 'reinvitar': S.enlace = { correo: u.correo, uid: u.id }; if (u.estado !== 'activo') u.estado = 'invitado'; flash('Enlace generado.'); ir('a-usuarios'); break;
    case 'pedir-confirmar': S.p.confirmar = 1; render(); break;
    case 'no-confirmar': delete S.p.confirmar; render(); break;
    case 'desactivar': u.estado = 'inactivo'; delete S.p.confirmar; flash('Usuario desactivado. Ya no puede entrar ni ver precios.'); render(); break;
    case 'reactivar': u.estado = 'activo'; flash('Usuario reactivado.'); render(); break;
    case 'rechazar': S.usuarios = S.usuarios.filter(function (x) { return x !== u; }); flash('Solicitud rechazada y eliminada.'); ir('a-usuarios'); break;
    case 'probar': flash('En la vista previa no hay conexión real. En el servidor, este botón confirma que tus claves de Syscom funcionan.', 'info'); render(); break;
    case 'borrar-post':
      S.posts = posts().filter(function (x) { return x.id !== S.p.id; }); S.borrador = null; flash('Artículo borrado.'); ir('a-blog'); break;
    case 'cache': flash('Caché borrada. Los siguientes productos se cargarán frescos del proveedor.'); render(); break;
  }
});

app.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset.accion === 'subir-portada' && t.files && t.files[0]) {
    var lector = new FileReader();
    lector.onload = function () {
      var im = new Image();
      im.onload = function () {
        var w = Math.min(1200, im.width), h = Math.round(im.height * w / im.width), c = document.createElement('canvas');
        c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
        S.borrador.img = c.toDataURL('image/jpeg', 0.82);
        var tt = val('bp-titulo'), tx = document.getElementById('bp-texto').value, ct = val('bp-cat');
        render(); document.getElementById('bp-titulo').value = tt; document.getElementById('bp-texto').value = tx; document.getElementById('bp-cat').value = ct;
      };
      im.src = lector.result;
    };
    lector.readAsDataURL(t.files[0]); return;
  }
  if (t.dataset.accion === 'stock') { S.p.stock = t.checked ? '1' : ''; render(); return; }
  if (t.dataset.accion === 'orden') { S.p.orden = t.value; render(); return; }
  if (t.dataset.accion === 'filtro-estado') { S.p.estado = t.value; render(); return; }
  if (t.dataset.cant) {
    var n = Math.max(1, Math.min(9999, parseInt(t.value, 10) || 1));
    S.cot.items.forEach(function (i) { if (i.id === t.dataset.cant) i.cant = n; });
    render(); var f = document.getElementById(t.id); if (f) f.focus(); return;
  }
});
app.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.dataset.campo) S.cot[t.dataset.campo] = t.value;
});

function val(id) { var x = document.getElementById(id); return x ? x.value.trim() : ''; }
function errorEn(id, msg) { document.getElementById(id).innerHTML = '<div class="aviso aviso-error" role="alert">' + msg + '</div>'; }
app.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target, tipo = f.dataset.form, boton = ev.submitter ? ev.submitter.value : '';
  if (tipo === 'buscar') { var q = val('q'); ir('catalogo', q ? { q: q } : {}); return; }
  if (tipo === 'agregar') {
    var id = f.querySelector('[name=id]').value, cant = Math.max(1, Math.min(9999, parseInt(val('cant'), 10) || 1)), p = prod(id), ya = null;
    S.cot.items.forEach(function (i) { if (i.id === id) ya = i; });
    if (ya) ya.cant += cant; else S.cot.items.push({ id: id, cant: cant });
    flash('Agregaste ' + cant + ' × ' + e(p.modelo) + ' a tu cotización. ' + L('cotizacion', null, 'Ver cotización'));
    render(); return;
  }
  if (tipo === 'guardar-post') {
    var titulo = val('bp-titulo'), texto = document.getElementById('bp-texto').value.trim();
    if (!titulo || !texto) { errorEn('bp-error', 'Escribe el título y el texto del artículo.'); return; }
    var html = textoAHtml(texto), pub = boton === 'publicar', ex = S.p.id ? posts().filter(function (x) { return x.id === S.p.id; })[0] : null;
    if (ex) {
      if (pub && ex.estado !== 'publicado') ex.fecha = hoyTexto();
      ex.t = titulo; ex.html = html; ex.tag = val('bp-cat'); ex.img = S.borrador.img; ex.min = minutos(html); ex.estado = pub ? 'publicado' : 'borrador';
    } else {
      posts().unshift({ id: 'n' + Date.now(), t: titulo, html: html, tag: val('bp-cat'), img: S.borrador.img, min: minutos(html), fecha: hoyTexto(), estado: pub ? 'publicado' : 'borrador' });
    }
    S.borrador = null; flash(pub ? 'Artículo publicado. Ya aparece en el blog.' : 'Guardado como borrador. No se ve en el blog hasta que lo publiques.'); ir('a-blog'); return;
  }
  if (tipo === 'suscribir') {
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val('nl-correo'))) { errorEn('nl-error', 'Escribe un correo válido.'); return; }
    S.suscrito = true; render(); return;
  }
  if (tipo === 'contacto') {
    var falt = [];
    if (!val('c-nombre')) falt.push('tu nombre');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val('c-correo'))) falt.push('un correo válido');
    if (!val('c-tel')) falt.push('un teléfono');
    if (falt.length) { errorEn('c-error', 'Falta ' + falt.join(', ') + '.'); return; }
    ir('contacto', { ok: 1 }); return;
  }
  if (tipo === 'login') { S.rol = val('l-correo').toLowerCase().indexOf('admin') >= 0 ? 'admin' : 'cliente'; ir(S.rol === 'admin' ? 'a-usuarios' : 'tienda'); return; }
  if (tipo === 'olvide') { ir('olvide', { ok: 1 }); return; }
  if (tipo === 'solicitar') {
    var faltan = [];
    if (!val('s-nombre')) faltan.push('tu nombre'); if (!val('s-empresa')) faltan.push('tu empresa');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val('s-correo'))) faltan.push('un correo válido'); if (!val('s-tel')) faltan.push('un teléfono');
    if (faltan.length) { errorEn('s-error', 'Falta ' + faltan.join(', ') + '.'); return; }
    S.usuarios.push({ id: S.siguienteUsuario++, nombre: val('s-nombre'), empresa: val('s-empresa'), correo: val('s-correo').toLowerCase(), telefono: val('s-tel'), rol: 'cliente', nivel: null, estado: 'pendiente', alta: Date.now(), mensaje: val('s-msg') });
    ir('solicitar', { ok: 1 }); return;
  }
  if (tipo === 'activar') {
    var a = val('a-p1'), b = val('a-p2');
    if (a.length < 8) { errorEn('a-error', 'La contraseña debe tener al menos 8 caracteres.'); return; }
    if (a !== b) { errorEn('a-error', 'Las contraseñas no coinciden.'); return; }
    var ua = usuario(+S.p.uid); if (ua) ua.estado = 'activo';
    ir('activar', { ok: 1, uid: S.p.uid }); return;
  }
  if (tipo === 'filtro-usuarios') { S.p.q = val('bq'); render(); return; }
  if (tipo === 'crear-usuario') {
    var correo = val('n-correo').toLowerCase();
    if (!val('n-nombre') || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) { errorEn('n-error', 'Escribe nombre y un correo válido.'); return; }
    if (S.usuarios.some(function (x) { return x.correo === correo; })) { errorEn('n-error', 'Ya existe un usuario con ese correo.'); return; }
    var nv = val('n-nivel'), nu = { id: S.siguienteUsuario++, nombre: val('n-nombre'), empresa: val('n-empresa') || val('n-nombre'), correo: correo, telefono: val('n-tel'), rol: nv === 'admin' ? 'admin' : 'cliente', nivel: nv === 'admin' ? null : +nv, estado: 'invitado', alta: Date.now() };
    S.usuarios.push(nu); S.enlace = { correo: correo, uid: nu.id }; flash('Usuario creado.'); ir('a-usuarios'); return;
  }
  if (tipo === 'guardar-usuario') {
    var u = usuario(+S.p.uid), sel = u.id === 1 ? 'admin' : val('u-nivel');
    if (boton === 'aprobar' && !sel) { errorEn('u-error', 'Elige un nivel de precio para aprobar.'); return; }
    u.nombre = val('u-nombre'); u.empresa = val('u-empresa'); u.correo = val('u-correo'); u.telefono = val('u-tel');
    if (sel === 'admin') { u.rol = 'admin'; u.nivel = null; } else if (sel) { u.rol = 'cliente'; u.nivel = +sel; }
    if (boton === 'aprobar') { u.estado = 'invitado'; S.enlace = { correo: u.correo, uid: u.id }; flash('Solicitud aprobada. Le enviamos la invitación.'); ir('a-usuarios'); return; }
    flash('Cambios guardados.'); render(); return;
  }
  if (tipo === 'nivel') {
    var n = nivel(+f.dataset.id);
    if (boton === 'borrar') {
      var usan = S.usuarios.filter(function (x) { return x.nivel === n.id; }).length;
      if (usan) flash('No se puede borrar: ' + usan + ' usuario(s) tienen este nivel. Cámbialos primero.', 'error');
      else { S.niveles = S.niveles.filter(function (x) { return x !== n; }); flash('Nivel borrado.'); }
      render(); return;
    }
    var m = parseFloat(f.querySelector('[name=margen]').value), nom = f.querySelector('[name=nombre]').value.trim();
    if (!nom || isNaN(m) || m < 0 || m > 500) { flash('Escribe un nombre y un margen entre 0 y 500 %.', 'error'); render(); return; }
    n.nombre = nom; n.margen = m; flash('Nivel actualizado. Los precios nuevos ya se ven en la tienda.'); render(); return;
  }
  if (tipo === 'nuevo-nivel') {
    var mm = parseFloat(val('nn-margen')), nn = val('nn-nombre');
    if (!nn || isNaN(mm) || mm < 0 || mm > 500) { flash('Escribe un nombre y un margen entre 0 y 500 %.', 'error'); render(); return; }
    S.niveles.push({ id: Date.now(), nombre: nn, margen: mm }); flash('Nivel “' + e(nn) + '” creado.'); render(); return;
  }
  if (tipo === 'estado-cot') {
    var c = S.cotizaciones.filter(function (x) { return x.folio === +S.p.folio; })[0];
    c.estado = val('ec-estado'); c.nota = val('ec-nota'); flash('Cotización actualizada.'); render(); return;
  }
});

render();
})();
</script>
